<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" fill="#C5C5C5">
  <!-- TV/monitor body -->
  <rect x="1" y="2" width="14" height="10" rx="1" ry="1" fill="none" stroke="#C5C5C5" stroke-width="1.2"/>
  <!-- Screen -->
  <rect x="2.5" y="3.5" width="11" height="7" rx="0.5" ry="0.5" fill="none" stroke="#C5C5C5" stroke-width="0.6"/>
  <!-- Play triangle on screen -->
  <polygon points="6,5 6,9 10,7" fill="#C5C5C5"/>
  <!-- Stand -->
  <line x1="8" y1="12" x2="8" y2="14" stroke="#C5C5C5" stroke-width="1.2"/>
  <line x1="5" y1="14" x2="11" y2="14" stroke="#C5C5C5" stroke-width="1.2" stroke-linecap="round"/>
</svg>
