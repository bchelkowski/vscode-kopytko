name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, map, and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Fails when MAP.md / docs/reference / the README settings block are
      # stale, or when a new source directory has no purpose in
      # scripts/map-areas.json. `npm run lint` also runs this; it is called out
      # separately here so a failure names the real cause in the job log.
      - name: Check generated context files
        run: npm run map -- --check

      # Fails when a README/docs/site number no longer matches the code —
      # built-in counts, lint rules, formatter options, CST passes, providers.
      - name: Check documentation claims
        run: npm run check:claims

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test
