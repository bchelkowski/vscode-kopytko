<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" fill="#C5C5C5">
  <!-- Remote body -->
  <rect x="4.25" y="0.75" width="7.5" height="14.5" rx="2.6" ry="2.6" fill="none" stroke="#C5C5C5" stroke-width="1.1"/>
  <!-- Back / Home row -->
  <circle cx="6.1" cy="3.1" r="0.65" fill="#C5C5C5"/>
  <circle cx="9.9" cy="3.1" r="0.65" fill="#C5C5C5"/>
  <!-- D-pad -->
  <circle cx="8" cy="7.3" r="2.15" fill="none" stroke="#C5C5C5" stroke-width="1"/>
  <circle cx="8" cy="7.3" r="0.6" fill="#C5C5C5"/>
  <!-- Media button row -->
  <rect x="5.1" y="11" width="2.3" height="1.3" rx="0.65" fill="#C5C5C5"/>
  <rect x="8.6" y="11" width="2.3" height="1.3" rx="0.65" fill="#C5C5C5"/>
  <!-- Bottom bar -->
  <rect x="5.9" y="13" width="4.2" height="1.05" rx="0.52" fill="#C5C5C5"/>
</svg>
