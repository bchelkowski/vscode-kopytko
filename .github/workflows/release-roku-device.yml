name: Release kopytko-roku-device

on:
  workflow_dispatch:
    inputs:
      bump:
        description: 'Version bump type'
        required: true
        type: choice
        options:
          - patch
          - minor
          - major

permissions:
  contents: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/roku-device

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Configure git
        run: |
          git config user.name "Błażej Chełkowski"
          git config user.email "bchelkow@gmail.com"

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Bump version
        id: version
        run: |
          npm version ${{ inputs.bump }} --no-git-tag-version
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Bumped to $VERSION"

      - name: Generate changelog entry
        id: changelog
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          DATE=$(date +%Y-%m-%d)
          SCOPE="roku-device"
          PREV_TAG=$(git tag --list 'kopytko-roku-device-v*' --sort=-v:refname | head -1)

          if [ -n "$PREV_TAG" ]; then
            SUBJECTS=$(git log "$PREV_TAG"..HEAD --pretty=format:"%s" --no-merges)
          else
            SUBJECTS=$(git log --pretty=format:"%s" --no-merges)
          fi

          # Extract lines for each section, stripping the type(scope): prefix and capitalising
          pick() {
            echo "$SUBJECTS" \
              | grep -E "^$1\($SCOPE\)!?:" \
              | sed -E "s/^$1\($SCOPE\)!?: (.)/- \u\1/" \
              | sed -E "s/^- (.)/- \1/"
          }

          BREAKING=$(echo "$SUBJECTS" | grep -E "^\w+\($SCOPE\)!:" \
            | sed -E "s/^\w+\($SCOPE\)!: (.)/- \u\1/" | sed -E "s/^- (.)/- \1/")
          ADDED=$(pick "feat")
          FIXED=$(pick "fix")
          CHANGED=$(echo "$SUBJECTS" | grep -E "^(refactor|perf)\($SCOPE\)!?:" \
            | sed -E "s/^(refactor|perf)\($SCOPE\)!?: (.)/- \u\2/" | sed -E "s/^- (.)/- \1/")
          MAINTENANCE=$(pick "chore")

          # Build entry into a temp file to preserve newlines
          ENTRY_FILE=$(mktemp)
          echo "## [$VERSION] - $DATE" >> "$ENTRY_FILE"
          if [ -n "$BREAKING" ]; then
            echo "" >> "$ENTRY_FILE"
            echo "### Breaking Changes" >> "$ENTRY_FILE"
            echo "$BREAKING" >> "$ENTRY_FILE"
          fi
          if [ -n "$ADDED" ]; then
            echo "" >> "$ENTRY_FILE"
            echo "### Added" >> "$ENTRY_FILE"
            echo "$ADDED" >> "$ENTRY_FILE"
          fi
          if [ -n "$FIXED" ]; then
            echo "" >> "$ENTRY_FILE"
            echo "### Fixed" >> "$ENTRY_FILE"
            echo "$FIXED" >> "$ENTRY_FILE"
          fi
          if [ -n "$CHANGED" ]; then
            echo "" >> "$ENTRY_FILE"
            echo "### Changed" >> "$ENTRY_FILE"
            echo "$CHANGED" >> "$ENTRY_FILE"
          fi
          if [ -n "$MAINTENANCE" ]; then
            echo "" >> "$ENTRY_FILE"
            echo "### Maintenance" >> "$ENTRY_FILE"
            echo "$MAINTENANCE" >> "$ENTRY_FILE"
          fi
          # If no matching commits, write a plain fallback line
          if [ "$(wc -l < "$ENTRY_FILE")" -eq 1 ]; then
            echo "" >> "$ENTRY_FILE"
            echo "- Release $VERSION" >> "$ENTRY_FILE"
          fi

          echo "entry<<EOF" >> "$GITHUB_OUTPUT"
          cat "$ENTRY_FILE" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"
          rm "$ENTRY_FILE"

      - name: Update CHANGELOG.md
        env:
          ENTRY: ${{ steps.changelog.outputs.entry }}
        run: |
          cd "$GITHUB_WORKSPACE"

          if [ -f packages/roku-device/CHANGELOG.md ]; then
            # Insert after the first "# Changelog" header line
            awk -v entry="$ENTRY" '
              /^# Changelog/ { print; getline; print; print ""; print entry; next }
              { print }
            ' packages/roku-device/CHANGELOG.md > /tmp/changelog.tmp
            mv /tmp/changelog.tmp packages/roku-device/CHANGELOG.md
          else
            echo -e "# Changelog\n\n$ENTRY\n" > packages/roku-device/CHANGELOG.md
          fi

      - name: Commit, tag, and push
        run: |
          cd "$GITHUB_WORKSPACE"
          VERSION="${{ steps.version.outputs.version }}"
          TAG="kopytko-roku-device-v${VERSION}"
          git add packages/roku-device/package.json packages/roku-device/package-lock.json packages/roku-device/CHANGELOG.md
          git commit -m "chore(roku-device): release v${VERSION}"
          git tag "$TAG" -m "kopytko-roku-device v${VERSION}"
          git push origin HEAD --tags

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: kopytko-roku-device-v${{ steps.version.outputs.version }}
          name: kopytko-roku-device v${{ steps.version.outputs.version }}
          body: ${{ steps.changelog.outputs.entry }}
          generate_release_notes: false

      - name: Publish to npm
        run: npm publish --access public --provenance

      - name: Update root kopytko-roku-device dependency
        working-directory: ${{ github.workspace }}
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          for i in 1 2 3 4 5; do
            npm view "kopytko-roku-device@${VERSION}" version && break
            echo "Waiting for npm registry to propagate (attempt $i)..."
            sleep 15
          done
          # Drop the file:-era postinstall build hook if it is still present —
          # once the dependency comes from the registry it is no longer needed.
          node -e "
            const fs = require('fs');
            const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
            if (pkg.scripts && pkg.scripts.postinstall === 'npm run build:roku-device') {
              delete pkg.scripts.postinstall;
              fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2) + '\n');
            }
          "
          npm install "kopytko-roku-device@${VERSION}"

      - name: Commit and push root dependency update
        working-directory: ${{ github.workspace }}
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          git add package.json package-lock.json
          git diff --cached --quiet && echo "No changes" || {
            git commit -m "chore(vscode-kopytko): bump kopytko-roku-device to v${VERSION}"
            git push origin HEAD
          }

  deploy-pages:
    name: Deploy GitHub Pages
    needs: release
    uses: ./.github/workflows/gh-pages.yml
    permissions:
      contents: read
      pages: write
      id-token: write
