name: Release vscode-kopytko

on:
  workflow_dispatch:
    inputs:
      bump:
        description: 'Version bump type'
        required: true
        type: choice
        options:
          - patch
          - minor
          - major

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Install dependencies
        run: npm ci

      - name: Bundle
        run: npm run bundle

      - name: Lint
        run: npm run lint

      - name: Run tests
        run: npm test

      - name: Bump version
        id: version
        run: |
          npm version ${{ inputs.bump }} --no-git-tag-version
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Bumped to $VERSION"

      - name: Generate changelog entry
        id: changelog
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          DATE=$(date +%Y-%m-%d)
          SCOPE="vscode-kopytko"
          PREV_TAG=$(git tag --list 'v*' --sort=-v:refname | grep -v 'kopytko-formatter' | head -1)

          if [ -n "$PREV_TAG" ]; then
            SUBJECTS=$(git log "$PREV_TAG"..HEAD --pretty=format:"%s" --no-merges)
          else
            SUBJECTS=$(git log --pretty=format:"%s" --no-merges)
          fi

          # Extract lines for each section, stripping the type(scope): prefix and capitalising
          pick() {
            echo "$SUBJECTS" \
              | grep -E "^$1\($SCOPE\)!?:" \
              | sed -E "s/^$1\($SCOPE\)!?: (.)/- \u\1/" \
              | sed -E "s/^- (.)/- \1/"
          }

          BREAKING=$(echo "$SUBJECTS" | grep -E "^\w+\($SCOPE\)!:" \
            | sed -E "s/^\w+\($SCOPE\)!: (.)/- \u\1/" | sed -E "s/^- (.)/- \1/")
          ADDED=$(pick "feat")
          FIXED=$(pick "fix")
          CHANGED=$(echo "$SUBJECTS" | grep -E "^(refactor|perf)\($SCOPE\)!?:" \
            | sed -E "s/^(refactor|perf)\($SCOPE\)!?: (.)/- \u\2/" | sed -E "s/^- (.)/- \1/")
          MAINTENANCE=$(pick "chore")

          # Build entry into a temp file to preserve newlines
          ENTRY_FILE=$(mktemp)
          echo "## [$VERSION] - $DATE" >> "$ENTRY_FILE"
          if [ -n "$BREAKING" ]; then
            echo "" >> "$ENTRY_FILE"
            echo "### Breaking Changes" >> "$ENTRY_FILE"
            echo "$BREAKING" >> "$ENTRY_FILE"
          fi
          if [ -n "$ADDED" ]; then
            echo "" >> "$ENTRY_FILE"
            echo "### Added" >> "$ENTRY_FILE"
            echo "$ADDED" >> "$ENTRY_FILE"
          fi
          if [ -n "$FIXED" ]; then
            echo "" >> "$ENTRY_FILE"
            echo "### Fixed" >> "$ENTRY_FILE"
            echo "$FIXED" >> "$ENTRY_FILE"
          fi
          if [ -n "$CHANGED" ]; then
            echo "" >> "$ENTRY_FILE"
            echo "### Changed" >> "$ENTRY_FILE"
            echo "$CHANGED" >> "$ENTRY_FILE"
          fi
          if [ -n "$MAINTENANCE" ]; then
            echo "" >> "$ENTRY_FILE"
            echo "### Maintenance" >> "$ENTRY_FILE"
            echo "$MAINTENANCE" >> "$ENTRY_FILE"
          fi
          # If no matching commits, write a plain fallback line
          if [ "$(wc -l < "$ENTRY_FILE")" -eq 1 ]; then
            echo "" >> "$ENTRY_FILE"
            echo "- Release $VERSION" >> "$ENTRY_FILE"
          fi

          echo "entry<<EOF" >> "$GITHUB_OUTPUT"
          cat "$ENTRY_FILE" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"
          rm "$ENTRY_FILE"

      - name: Update CHANGELOG.md
        env:
          ENTRY: ${{ steps.changelog.outputs.entry }}
        run: |
          if [ -f CHANGELOG.md ]; then
            awk -v entry="$ENTRY" '
              /^# Changelog/ { print; getline; print; print ""; print entry; next }
              { print }
            ' CHANGELOG.md > /tmp/changelog.tmp
            mv /tmp/changelog.tmp CHANGELOG.md
          else
            echo -e "# Changelog\n\n$ENTRY\n" > CHANGELOG.md
          fi

      - name: Commit, tag, and push
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          TAG="v${VERSION}"
          git add package.json package-lock.json CHANGELOG.md
          git commit -m "chore: release v${VERSION}"
          git tag "$TAG" -m "vscode-kopytko v${VERSION}"
          git push origin HEAD --tags

      - name: Package VSIX
        run: npx vsce package

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: vscode-kopytko v${{ steps.version.outputs.version }}
          body: ${{ steps.changelog.outputs.entry }}
          files: '*.vsix'
          generate_release_notes: false

      - name: Publish to VS Code Marketplace
        run: npx vsce publish --no-git-tag-version
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}

  deploy-pages:
    name: Deploy GitHub Pages
    needs: release
    uses: ./.github/workflows/gh-pages.yml
    permissions:
      contents: read
      pages: write
      id-token: write
